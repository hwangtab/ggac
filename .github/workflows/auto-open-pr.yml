name: Auto Open PR on Push

on:
  push:
    branches-ignore:
      - main

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PR exists to main
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '')
            const owner = context.repo.owner
            const repo = context.repo.repo

            if (branch === 'main') {
              core.info('Branch is main; skipping PR creation.')
              return
            }

            // Find existing open PR from this branch to main
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 100,
            })

            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number}`)
              return
            }

            // Get last commit message for title
            const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: branch, per_page: 1 })
            const title = commits[0]?.commit?.message?.split('\n')[0] || `Update from ${branch}`

            const body = `자동 생성된 PR입니다.\n\n- 브랜치: ${branch}\n- 생성 시각: ${new Date().toISOString()}`

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: 'main',
              body,
              draft: false,
            })

            core.info(`Created PR #${pr.number}`)
