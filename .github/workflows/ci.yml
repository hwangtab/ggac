name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality & Type Check

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check Prettier formatting
        run: npx prettier --check .

      # 스키마 계약 검사는 node:fs globSync(Node 22+)를 쓰므로 22.x에서만 실행.
      # 스냅샷 JSON을 대조하므로 DB 접속은 불필요.
      - name: Check schema contract
        if: matrix.node-version == '22.x'
        run: npm run test:schema-contract

      # 런타임 리스크 정적 게이트: 인증 경계·경로 봉쇄·SSRF 방어 등 보안 불변식이
      # 회귀하지 않는지 소스를 정적으로 검사한다. Node 버전 제약은 없지만 20.x에서도
      # 중복 실행할 이유가 없으므로 스키마 계약 검사와 동일하게 22.x에서만 실행한다.
      - name: Check runtime risk gate
        if: matrix.node-version == '22.x'
        run: npm run test:runtime-risks

      # 단위 테스트는 src/**/*.ts를 직접 import한다(타입 스트리핑 필요). 20.x에는
      # 타입 스트리핑이 없고, 22.x는 --experimental-strip-types 플래그가 필요하다
      # (플래그는 test:unit 스크립트에 있음). 그래서 22.x에서만 실행한다.
      - name: Run unit tests
        if: matrix.node-version == '22.x'
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    name: Build Test
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  smoke-test:
    runs-on: ubuntu-latest
    name: Playwright Smoke Test
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test e2e/smoke.spec.ts --project=chromium

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --config ./audit-ci.json
        continue-on-error: true
