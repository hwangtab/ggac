name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality & Type Check

    strategy:
      matrix:
        # 20.x는 EOL이라 보안 패치가 없다. 22.x는 Vercel 런타임이라 lint·tsc만
        # 확인하고, 테스트 게이트는 로컬과 같은 24.x에서 돈다(로컬 Node는 24만 둔다).
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check Prettier formatting
        run: npx prettier --check .

      # 스키마 계약 검사는 node:fs globSync(Node 22+)를 쓴다. 게이트는 24.x에서만 돈다.
      # 스냅샷 JSON을 대조하므로 DB 접속은 불필요.
      - name: Check schema contract
        if: matrix.node-version == '24.x'
        run: npm run test:schema-contract

      # 런타임 리스크 정적 게이트: 인증 경계·경로 봉쇄·SSRF 방어 등 보안 불변식이
      # 회귀하지 않는지 소스를 정적으로 검사한다. Node 버전 제약은 없지만 두 번
      # 돌릴 이유가 없으므로 스키마 계약 검사와 같이 24.x에서만 실행한다.
      - name: Check runtime risk gate
        if: matrix.node-version == '24.x'
        run: npm run test:runtime-risks

      # 쿼리 계층 테스트(documentVisibility·ingestInbound·queriesMailbox)는
      # `file:local.db`에 실제로 쓰고 읽는다. 새 체크아웃에는 이 파일이 없어
      # `no such table`로 깨지므로 스키마를 먼저 밀어 넣는다.
      - name: Prepare local unit-test database
        if: matrix.node-version == '24.x'
        run: npx drizzle-kit push --force
        env:
          TURSO_DATABASE_URL: file:local.db

      # 단위 테스트는 src/**/*.ts를 직접 import한다(타입 스트리핑 필요). 24.x는
      # 타입 스트리핑이 기본이라 로컬과 같은 조건으로 돈다(test:unit의
      # --experimental-strip-types 플래그는 22.x 호환용으로 남아 있다).
      - name: Run unit tests
        if: matrix.node-version == '24.x'
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    name: Build Test
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 단계 4 컷오버 이후 빌드는 Turso를 읽는다. 그리고 최종 리뷰(B-1)가
      # "아티스트 조회 실패·0건이면 운영 빌드를 실패시킨다"를 넣었으므로,
      # 빌드에는 최소 1행이 있는 DB가 필요하다.
      #
      # CI에 운영 자격증명을 주지 않는다 — CI가 운영 DB를 읽을 이유가 없고
      # 토큰이 새는 자리만 는다. 대신 로컬 파일 DB를 만들어 쓴다.
      # (`file:` URL은 assertProductionCredentials가 토큰을 요구하지 않는 경로다.)
      - name: Prepare local build database
        run: |
          npx drizzle-kit push --force
          node scripts/testing/seed-build-fixture.mjs
        env:
          TURSO_DATABASE_URL: file:./ci-build.db

      - name: Build application
        run: npm run build
        env:
          TURSO_DATABASE_URL: file:./ci-build.db
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_PUBLIC_BLOB_PUBLIC_BASE_URL: https://ci-placeholder.public.blob.vercel-storage.com

  smoke-test:
    runs-on: ubuntu-latest
    name: Playwright Smoke Test
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test e2e/smoke.spec.ts --project=chromium

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  authz-e2e:
    runs-on: ubuntu-latest
    name: Authorization E2E
    needs: quality
    # 권한 경계는 이 앱에서 가장 중요한 계약이다(조합원 문서·회비·이사회 서류·메일함). 그런데
    # 2026-11-06까지 이 스위트는 **로컬 수동 실행에만** 기대고 있었다 — CI는 smoke.spec.ts 하나만
    # 돌렸으므로, 권한이 느슨해지는 회귀가 병합돼도 아무 검사도 빨간불이 되지 않았다.
    #
    # 로컬과 같은 조건을 CI에 만든다.
    #  - DB: `turso dev`(파일 DB). 미들웨어가 Edge 런타임에서 `file:` URL을 거부하므로
    #    (`URL_SCHEME_NOT_SUPPORTED`) 파일 경로를 직접 줄 수 없다.
    #  - 서버: 운영 빌드(`E2E_PROD_SERVER=1`) — dev 서버는 첫 컴파일 대기 때문에 30초 타임아웃과
    #    로그인 튕김이 섞인다(playwright.config.ts 주석).
    #  - 브라우저: 워크플로가 받는 번들 크로미움(로컬은 설치된 Chrome).
    #  - Blob 토큰은 주지 않는다 — 정책 36은 토큰이 없으면 스스로 건너뛴다. 운영 공개 스토어
    #    토큰을 CI에 넣을 이유가 없다.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start local Turso
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          # install.sh는 turso CLI와 sqld(러너)를 모두 ~/.turso/에 받고 PATH 수정은
          # update_profile(~/.profile)로만 남긴다 — 현재 셸엔 반영되지 않아, 이 단계와
          # 다음 단계에 sqld가 없다. 명시적으로 PATH에 넣는다.
          echo "$HOME/.turso" >> "$GITHUB_PATH"
          PATH="$HOME/.turso:$PATH" "$HOME/.turso/turso" dev --db-file /tmp/authz.db --port 8901 > /tmp/turso-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8901/health > /dev/null; then
              echo "turso dev 준비됨"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/turso-dev.log
          exit 1

      - name: Apply schema and seed fixtures
        env:
          TURSO_DATABASE_URL: http://127.0.0.1:8901
          BETTER_AUTH_SECRET: ci-authz-placeholder-not-a-real-secret
        run: |
          npx drizzle-kit push --force
          node --experimental-strip-types scripts/testing/seed-authz-fixtures.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run authorization E2E
        env:
          E2E_TURSO_DATABASE_URL: http://127.0.0.1:8901
          E2E_PROD_SERVER: "1"
          BETTER_AUTH_SECRET: ci-authz-placeholder-not-a-real-secret
          TIMEBANK_REJOIN_SECRET: ci-authz-timebank-rejoin-placeholder-32
          NEXT_PUBLIC_BLOB_PUBLIC_BASE_URL: https://ci-placeholder.public.blob.vercel-storage.com
        run: npm run test:e2e:authz

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-authz-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx audit-ci --config ./audit-ci.json
        continue-on-error: true
