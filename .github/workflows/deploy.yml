name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy Project Artifacts
      id: deploy
      run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

    - name: Post-deployment verification
      run: |
        # 배포된 사이트가 정상적으로 작동하는지 확인
        sleep 30  # 배포 완료 대기
        curl -f ${{ steps.deploy.outputs.url }} || exit 1
        echo "✅ Deployment verification completed"

    - name: Update deployment status
      if: success()
      run: |
        echo "🚀 Deployment successful: ${{ steps.deploy.outputs.url }}"
        echo "::notice title=Deployment Success::Site deployed to ${{ steps.deploy.outputs.url }}"
