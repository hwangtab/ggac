# 지원사업 회차를 **손으로** 발행한다(수동 실행 전용).
#
# 정기 발행은 Vercel Cron이 한다(`vercel.json`, 월 17:17·예비 20:17 KST — 켜고 끄는 것은
# Vercel 환경변수 GRANT_AUTO_PUBLISH). 여기 예약 실행을 두지 않는 이유: GitHub 예약 실행이
# 실측 7시간 늦게 돌았다(2026-10-26, 17:17 예정이 다음 날 00:15).
#
# 이 워크플로는 Vercel 크론이 빠졌거나 멈춘 주에 같은 판정·같은 발행 경로를 손으로 부를 때
# 쓴다. 입력 real=true일 때만 실제로 보내고, 비우면 드라이런이다.
#
# 멈춘 주(공고 0건·마감 지난 공고·회차 없음 등)나 메일 실패가 있으면 **실패로** 끝난다.
name: grant-digest-publish

on:
  workflow_dispatch:
    inputs:
      real:
        description: "true면 실제 발행. 비우면 드라이런."
        required: false
        default: ""

# 같은 회차를 두 번 손으로 눌러도 한 줄로 선다. 진행 중인 실행은 취소하지 않는다 —
# 메일이 반쯤 나간 채 끊긴다.
concurrency:
  group: grant-digest-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 발행 요청
        env:
          TOKEN: ${{ secrets.GRANT_DIGEST_CRON_TOKEN }}
          REAL_INPUT: ${{ github.event.inputs.real }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::GRANT_DIGEST_CRON_TOKEN 시크릿이 없다."
            exit 1
          fi

          URL=https://www.ggac.kr/api/internal/grant-digest/publish
          if [ "${REAL_INPUT:-}" = "true" ]; then
            echo "모드: 실제 발행"
          else
            echo "모드: 드라이런"
            URL="${URL}?dry=1"
          fi

          # 라우트의 maxDuration은 300초다. curl이 먼저 끊으면 서버는 계속 보내는데
          # Actions만 실패로 남는다 — 초안 워크플로와 같은 이유로 320초.
          HTTP=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --max-time 320 \
            -X POST "${URL}" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "HTTP ${HTTP}"

          # **본문을 그대로 찍지 마라.** 저장소가 공개라 Actions 로그도 공개다.
          # 사유(reasons)는 고정 문구와 건수뿐이라 찍어도 된다. id는 찍지 않는다.
          node -e '
            const fs = require("fs")
            try {
              const d = (JSON.parse(fs.readFileSync("/tmp/out.json", "utf8"))).data ?? {}
              if (d.published) console.log(`발행 완료 — 회차 ${d.week_key} · 메일 성공 ${d.email_sent} · 실패 ${d.email_failed}`)
              else if (d.blocked) console.log(`자동 발송 보류${d.dry ? "(드라이런)" : ""} — 회차 ${d.week_key}: ${(d.reasons ?? []).join(" ")}`)
              else if (d.would_publish) console.log(`드라이런: 보내도 되는 상태 — 회차 ${d.week_key} · 공고 ${d.items}건 · 신규 ${d.new_count}건`)
              else if (d.skipped) console.log(`건너뜀 — 회차 ${d.week_key} 상태 ${d.status}`)
              fs.writeFileSync("/tmp/blocked", d.blocked ? "1" : "0")
              fs.writeFileSync("/tmp/email_failed", String(d.published ? (d.email_failed ?? 0) : 0))
            } catch {
              console.log("응답 본문을 파싱하지 못했다(상태 코드로 판정한다).")
            }
          '

          if [ "${HTTP}" != "200" ] && [ "${HTTP}" != "201" ]; then
            echo "::error::발행 엔드포인트가 ${HTTP}를 반환했다 (401이면 토큰 불일치, 404면 이번 주 회차가 없다)."
            exit 1
          fi
          if [ "$(cat /tmp/blocked 2>/dev/null || echo 0)" = "1" ]; then
            echo "::error::자동 발송을 멈췄다. 관리자 알림을 확인하고 직접 발행해라."
            exit 1
          fi
          # 게시글은 나갔는데 메일 일부·전부가 실패했다(Resend 키 만료·장애 등). 초록으로 두면
          # 관리자 알림 한 줄 말고는 신호가 없다. **다시 발행하지 마라** — 성공한 사람에게
          # 메일이 두 번 간다. 원인(Resend 대시보드)을 보고 실패분만 손으로 처리한다.
          FAILED="$(cat /tmp/email_failed 2>/dev/null || echo 0)"
          if [ "${FAILED}" != "0" ]; then
            echo "::error::발행은 됐지만 메일 ${FAILED}통이 실패했다. 재발행하지 말고 Resend 상태를 확인해라."
            exit 1
          fi
