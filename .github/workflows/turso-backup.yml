name: Turso 야간 백업

on:
  schedule:
    # 매일 18:00 UTC = KST 03:00
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Turso CLI 설치
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: 덤프 생성
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          STAMP=$(date -u +%Y%m%d)
          # 이 CLI 버전(v1.0.31)에는 `turso db dump` 서브커맨드가 없다(브리프 작성
          # 당시 가정과 다름 — `turso db --help`의 Available Commands에도 없음).
          # 실제로 동작하는 것은 sqlite3 스타일 `.dump` shell 명령이며, 정확히
          # 같은 형식(PRAGMA/BEGIN TRANSACTION/CREATE.../COMMIT)을 만든다.
          turso db shell ggac-prod .dump > "ggac-prod-${STAMP}.sql"
          echo "DUMP_SQL=ggac-prod-${STAMP}.sql" >> "$GITHUB_ENV"

      - name: 덤프가 실제 SQL 덤프인지 확인
        run: |
          SIZE=$(stat -c%s "$DUMP_SQL")
          echo "덤프 크기: ${SIZE} bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "덤프가 1KB 미만이다. 백업 실패로 간주한다."
            exit 1
          fi
          # 존재하지 않는 서브커맨드를 잘못 불러 CLI 도움말 텍스트가 그대로
          # 저장되는 사고(발견 경위는 scripts/turso/README.md 참고)를 다시
          # 겪지 않도록, 크기뿐 아니라 실제 SQL 덤프 내용인지도 확인한다.
          if ! grep -q '^CREATE TABLE' "$DUMP_SQL"; then
            echo "덤프에 CREATE TABLE 구문이 없다. SQL 덤프가 아닌 것으로 보고 실패 처리한다."
            exit 1
          fi
          # CREATE TABLE 검사만으로는 스트림 중간에 잘린 덤프를 걸러내지 못한다
          # (앞부분에 CREATE TABLE이 있으면 통과해버린다). sqlite .dump는 항상
          # COMMIT;으로 끝나므로 마지막 줄을 추가로 검사한다.
          LAST_LINE=$(tail -n 1 "$DUMP_SQL")
          if [ "$LAST_LINE" != "COMMIT;" ]; then
            # 이 저장소는 public이라 Actions 로그가 누구나 볼 수 있다. 마지막
            # 줄이 COMMIT;이 아니라는 것은 곧 스트림 중간에 잘렸다는 뜻이고,
            # 그 경우 남은 조각은 조합원 실명·생년월일·연락처 등이 담긴 실제
            # INSERT 구문일 수 있으므로 내용을 절대 로그에 남기지 않는다.
            echo "덤프의 마지막 줄이 COMMIT;이 아니다(길이: ${#LAST_LINE}자). 스트림 중간에 잘린 것으로 보고 실패 처리한다. 실패 아티팩트를 안전한 채널로 직접 확인할 것(로그에 내용 미출력)."
            exit 1
          fi
          # ── 위 세 검사가 못 잡는 것: **내용이 비어도 통과한다.**
          # 적대 감사(2026-08-27)가 실행으로 증명했다 — INSERT를 전부 지운
          # 덤프(16KB)도 크기·CREATE TABLE·COMMIT; 세 검사를 모두 통과했고,
          # 복원하면 조합원 0명·글 0건·설정 0행인 껍데기가 나온다. 즉 운영
          # 데이터가 지워져도 백업은 매일 "성공"을 보고하고, 90일 뒤에는 빈
          # 백업만 남는다.
          #
          # 그래서 **표 개수와 행 개수의 하한**을 함께 본다. 숫자를 낮추려면
          # 이 파일을 고쳐야 하고 그 커밋이 리뷰에 남는다.
          TABLES=$(grep -c '^CREATE TABLE' "$DUMP_SQL" || true)
          INSERTS=$(grep -c '^INSERT INTO' "$DUMP_SQL" || true)
          echo "표 ${TABLES}개 · INSERT ${INSERTS}줄"

          MIN_TABLES=25
          MIN_INSERTS=15000
          if [ "$TABLES" -lt "$MIN_TABLES" ]; then
            echo "::error::표가 ${TABLES}개다(하한 ${MIN_TABLES}). 스키마가 통째로 빠진 덤프다."
            exit 1
          fi
          if [ "$INSERTS" -lt "$MIN_INSERTS" ]; then
            echo "::error::INSERT가 ${INSERTS}줄이다(하한 ${MIN_INSERTS}). 데이터가 빠진 껍데기 덤프다 — 이대로 보관하면 복구가 불가능하다."
            exit 1
          fi

          # 핵심 표가 실제로 담겼는지도 본다. 표 개수만으로는 "26표가 있는데
          # member_profiles만 비었다"를 못 잡는다.
          for T in member_profiles posts user artists board_documents; do
            if ! grep -q "^INSERT INTO \"\?${T}\"\? " "$DUMP_SQL" && ! grep -q "^INSERT INTO \`${T}\`" "$DUMP_SQL"; then
              echo "::error::${T} 표에 INSERT가 한 줄도 없다. 이 표가 비면 복구가 의미 없다."
              exit 1
            fi
          done

          gzip "$DUMP_SQL"
          echo "DUMP_FILE=${DUMP_SQL}.gz" >> "$GITHUB_ENV"

      - name: 백업 스크립트 의존성 설치
        run: npm ci --omit=dev --ignore-scripts

      - name: Vercel Blob 비공개 저장소에 업로드하고 90일 지난 백업 정리
        env:
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: node scripts/turso/upload-backup.mjs "$DUMP_FILE"

      # ── 사라진 CHECK 제약 20개 점검.
      #
      # Postgres → Turso 이전에서 CHECK 제약이 통째로 사라졌고(운영
      # sqlite_master 전문에 CHECK 0건), SQLite는 표를 재작성하지 않고는 다시
      # 붙일 수 없다. 막는 일은 앱 계층이 하지만, `turso db shell`로 손으로 친
      # UPDATE나 일회성 스크립트는 그 계층을 지나지 않는다. 그런 쓰기가 남긴
      # 위반은 **아무도 모르게 쌓인다** — 이 단계가 그걸 매일 본다.
      #
      # 운영 DB에 직접 붙지 않고 **방금 만든 덤프를 로컬 파일 DB로 복원해서**
      # 본다. 이유가 셋이다: ① 새 시크릿(TURSO_DATABASE_URL·TURSO_AUTH_TOKEN)이
      # 필요 없다 — 없는 시크릿에 기대면 조용히 빈 값으로 돌다가 "통과"만
      # 보고한다. ② 읽기 전용이 아니라 **운영에 접속조차 하지 않는다.**
      # ③ 덤프가 실제로 복원 가능한지도 같이 확인된다(위의 크기·행수 검사가
      # 못 보는 것).
      #
      # 업로드 **뒤에** 두는 것은 의도적이다. 위반이 나오면 이 단계가 job을
      # 실패시키는데, 그때도 백업은 이미 안전하게 올라가 있어야 한다.
      - name: 사라진 CHECK 제약을 덤프 복원본에서 점검
        run: |
          gzip -dc "$DUMP_FILE" > "$RUNNER_TEMP/backup-check.sql"
          node scripts/turso/restore-from-dump.mjs \
            "$RUNNER_TEMP/backup-check.sql" "file:$RUNNER_TEMP/backup-check.db"
          # 위반이 있으면 종료코드 1. 출력은 제약 이름과 **건수뿐**이다 —
          # 이 저장소는 public이라 Actions 로그가 누구나 볼 수 있고, 위반 행에는
          # 조합원 실명·연락처·계좌가 들어 있을 수 있다.
          node scripts/turso/check-invariants.mjs "file:$RUNNER_TEMP/backup-check.db"
